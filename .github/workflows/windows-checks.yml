name: Windows checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '*.props', '*.json', '*.sln', '.github/workflows/windows-checks.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Engine and WPF validation on Windows
        shell: pwsh
        run: ./scripts/Check-Windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-validation
          path: |
            artifacts/windows-validation
            artifacts/windows-ui
